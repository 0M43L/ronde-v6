<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronde V6 - IDEX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    
    /* LOGIN SCREEN */
    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    #loginScreen.hidden { display: none; }
    
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 400px;
    }
    
    .login-box h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    
    #loginForm {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    #loginForm input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }
    
    #loginForm button {
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    
    #loginForm button:hover { background: #5568d3; }
    
    #loginError {
      color: red;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    
    /* APP CONTENT */
    #appContent {
      display: none;
      padding: 20px;
    }
    
    #appContent.visible { display: block; }
    
    .header {
      background: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .header h2 { color: #333; margin-bottom: 10px; }
    .user-info { color: #666; font-size: 14px; }
    
    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    
    .logout-btn:hover { background: #c0392b; }
    
    .main-content {
      background: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .main-content h3 { color: #333; margin-bottom: 15px; }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-weight: bold;
    }
    
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    
    .form-group button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .form-group button:hover { background: #229954; }
    
    .substations-list {
      margin-top: 20px;
    }
    
    .substation-card {
      background: #f9f9f9;
      padding: 15px;
      border-left: 4px solid #667eea;
      margin-bottom: 10px;
      border-radius: 3px;
    }
    
    .substation-card h4 { color: #333; margin-bottom: 5px; }
    .substation-card p { color: #666; font-size: 13px; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Ronde V6</h1>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Mot de passe" required>
      <button type="submit">Connexion</button>
      <div id="loginError"></div>
    </form>
  </div>
</div>

<!-- APP CONTENT -->
<div id="appContent">
  <div class="header">
    <h2>Ronde V6 - IDEX</h2>
    <div class="user-info" id="userInfo"></div>
    <button class="logout-btn" onclick="logout()">Déconnexion</button>
  </div>
  
  <div class="main-content">
    <h3>Créer une nouvelle ronde</h3>
    
    <form id="rondeForm" onsubmit="saveRonde(event)">
      <div class="form-group">
        <label>Substation</label>
        <select id="substationSelect" required>
          <option value="">Choisir une substation...</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Notes</label>
        <input type="text" id="rondeNotes" placeholder="Notes d'inspection">
      </div>
      
      <div class="form-group">
        <button type="submit">Enregistrer la ronde</button>
      </div>
    </form>
    
    <div class="substations-list">
      <h3>Mes rondes récentes</h3>
      <div id="rondesList"></div>
    </div>
  </div>
</div>

<script>
// ============ INDEXEDDB LOCAL STORAGE ============
class LocalDB {
  constructor() {
    this.dbName = 'ronde_v6_local';
    this.version = 1;
  }

  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, this.version);
      
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('rondes')) {
          db.createObjectStore('rondes', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('checks')) {
          db.createObjectStore('checks', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('sync_queue')) {
          db.createObjectStore('sync_queue', { keyPath: 'id' });
        }
      };
      
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async save(store, data) {
    const db = await this.init();
    const tx = db.transaction(store, 'readwrite');
    
    return new Promise((resolve, reject) => {
      const req = tx.objectStore(store).put(data);
      req.onsuccess = () => resolve(data);
      req.onerror = () => reject(req.error);
    });
  }

  async getAll(store) {
    const db = await this.init();
    const tx = db.transaction(store, 'readonly');
    
    return new Promise((resolve, reject) => {
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async delete(store, id) {
    const db = await this.init();
    const tx = db.transaction(store, 'readwrite');
    
    return new Promise((resolve, reject) => {
      const req = tx.objectStore(store).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
}

const localDB = new LocalDB();

// ============ LOGIN LOGIC ============
const loginForm = document.getElementById('loginForm');
const loginScreen = document.getElementById('loginScreen');
const loginError = document.getElementById('loginError');
const appContent = document.getElementById('appContent');
const userInfo = document.getElementById('userInfo');

window.addEventListener('load', async () => {
  const token = localStorage.getItem('ronde_token');
  if (token) {
    const isValid = await verifyToken(token);
    if (isValid) {
      loginScreen.classList.add('hidden');
      appContent.classList.add('visible');
      await loadAppData();
    } else {
      localStorage.removeItem('ronde_token');
      loginScreen.classList.remove('hidden');
      appContent.classList.remove('visible');
    }
  }
});

async function verifyToken(token) {
  try {
    const response = await fetch('/api/verify', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    return response.ok;
  } catch (err) {
    return false;
  }
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    
    const data = await response.json();
    
    if (response.ok) {
      localStorage.setItem('ronde_token', data.token);
      localStorage.setItem('ronde_user', JSON.stringify(data.user));
      
      loginScreen.classList.add('hidden');
      appContent.classList.add('visible');
      
      await loadAppData();
    } else {
      loginError.textContent = data.error || 'Erreur de connexion';
      loginError.style.display = 'block';
    }
  } catch (error) {
    loginError.textContent = 'Erreur réseau';
    loginError.style.display = 'block';
    console.error('Login error:', error);
  }
});

function logout() {
  localStorage.removeItem('ronde_token');
  localStorage.removeItem('ronde_user');
  loginScreen.classList.remove('hidden');
  appContent.classList.remove('visible');
  loginForm.reset();
}

// ============ APP DATA LOADING ============
async function loadAppData() {
  const user = JSON.parse(localStorage.getItem('ronde_user'));
  if (user) {
    userInfo.textContent = `Connecté : ${user.prenom} ${user.nom} (${user.email})`;
  }
  
  await loadRondes();
}

async function saveRonde(event) {
  event.preventDefault();
  
  const user = JSON.parse(localStorage.getItem('ronde_user'));
  const subId = document.getElementById('substationSelect').value;
  const notes = document.getElementById('rondeNotes').value;
  
  if (!subId) {
    alert('Choisir une substation !');
    return;
  }
  
  const ronde = {
    id: `RONDE_${Date.now()}`,
    substation_id: subId,
    date_visite: new Date().toISOString(),
    tech_id: user.id,
    notes: notes,
    statut: 'en_cours',
    sync_status: 'pending'
  };
  
  await localDB.save('rondes', ronde);
  
  await localDB.save('sync_queue', {
    id: `sync_${Date.now()}`,
    entity_type: 'ronde',
    action: 'create',
    payload: ronde,
    sync_status: 'pending'
  });
  
  document.getElementById('rondeForm').reset();
  alert('✅ Ronde enregistrée (sync: en attente)');
  
  await loadRondes();
  
  await syncWithServer();
}

async function loadRondes() {
  const rondes = await localDB.getAll('rondes');
  const list = document.getElementById('rondesList');
  
  if (rondes.length === 0) {
    list.innerHTML = '<p>Aucune ronde pour le moment.</p>';
    return;
  }
  
  list.innerHTML = rondes.map(r => `
    <div class="substation-card">
      <h4>${r.substation_id}</h4>
      <p>Date: ${new Date(r.date_visite).toLocaleString()}</p>
      <p>Notes: ${r.notes || 'N/A'}</p>
      <p>Statut: <strong>${r.sync_status}</strong></p>
    </div>
  `).join('');
}

async function syncWithServer() {
  if (!navigator.onLine) {
    console.log('Offline - skipping sync');
    return;
  }

  try {
    const queue = await localDB.getAll('sync_queue');
    
    if (queue.length === 0) return;

    const response = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ queue }),
    });

    if (response.ok) {
      const results = await response.json();
      
      for (const item of queue) {
        await localDB.delete('sync_queue', item.id);
      }
      
      console.log(`✅ ${results.synced} items synced`);
      await loadRondes();
    }
  } catch (error) {
    console.error('Sync error:', error);
  }
}

window.addEventListener('online', () => {
  console.log('Back online - syncing...');
  syncWithServer();
});

setInterval(syncWithServer, 5 * 60 * 1000);
</script>

</body>
</html>
